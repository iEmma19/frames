<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sociale - International Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root {
    --text-primary: #ffffff;
    --text-secondary: rgba(238, 246, 255, 0.82);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Outfit', sans-serif; color: var(--text-primary);
    background: #05090f;
}

#bgPhoto {
    position: fixed; inset: 0; z-index: 0;
    background: url("https://xatimg.com/image/G2qhwG3vl95c.png") center/cover no-repeat;
}
#bgOverlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(circle at 50% 0%, rgba(12,19,37,.15), rgba(8,13,24,.78) 55%, rgba(8,13,24,.92));
}

/* Zăpadă care cade: un singur canvas */
#snow {
    position: fixed; inset: 0; z-index: 12;
    width: 100%; height: 100%;
    pointer-events: none;
}

.scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; z-index: 2; }

/* ── Titlu stânga ── */
.logo-area {
    position: absolute; left: 80px; top: 50%;
    transform: translateY(calc(-50% + 63px));
    z-index: 15; text-align: left;
    touch-action: none; -webkit-user-select: none; user-select: none;
}
.eyebrow {
    font-size: .75rem; letter-spacing: 4px; text-transform: uppercase;
    color: #fff; font-weight: 500; margin-bottom: 10px;
}
h1.logo-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 5vw, 72px);
    font-weight: 600; line-height: .9; margin-bottom: 10px;
    background: linear-gradient(105deg, #ffffff 0%, #d9f2ff 30%, #ffffff 50%, #a9d8f2 75%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 0 24px rgba(205,238,255,.35);
    position: relative;
    isolation: isolate;
}
.logo-sub { font-size: 1rem; font-weight: 300; color: #fff; margin-top: 10px; }

/* ── Panou reguli ── */
.rules-panel {
    position: absolute; top: 50%; right: 9%;
    transform: translateY(-50%) perspective(800px) rotateY(-10deg);
    transform-origin: left center;
    width: clamp(240px, 18vw, 310px);
    z-index: 15;
    display: flex; flex-direction: column;
    padding: 24px;
    background: linear-gradient(145deg, rgba(3,7,12,.97) 0%, rgba(12,22,32,.96) 55%, rgba(23,39,52,.94) 100%);
    border: 1px solid rgba(225,244,255,.30);
    border-radius: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.58), inset 0 1px 1px rgba(255,255,255,.14);
    transition: transform .3s ease;
    isolation: isolate;
}
.rules-panel:hover { transform: translateY(-50%) perspective(800px) rotateY(-6deg); }

.rules-header {
    font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #ffffff 0%, #c8eaff 50%, #a9d7f2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
}
.rule-item { display: flex; gap: 14px; margin-bottom: 20px; }
.rule-num {
    font-size: 1rem; font-weight: 800; min-width: 20px; letter-spacing: .02em;
    background: linear-gradient(90deg, #b7e4ff 0%, #ffffff 50%, #a9d7f2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
}
.rule-content h3 { color: #fff; }
.rule-content p { font-size: .75rem; font-weight: 300; line-height: 1.5; color: var(--text-secondary); }

.rules-footer {
    margin-top: auto; padding-top: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.08);
}
.rules-lang { display: flex; gap: 6px; justify-content: center; }
.lang-btn {
    border: 1px solid rgba(220,240,255,.2);
    background: rgba(220,240,255,.08);
    color: rgba(255,255,255,.85);
    padding: 6px 10px; border-radius: 999px;
    font-family: 'Outfit', sans-serif; font-size: .7rem; font-weight: 650;
    letter-spacing: .06em; text-transform: uppercase;
    cursor: pointer; text-decoration: none; line-height: 1;
}
.lang-btn.active {
    background: rgba(190,230,255,.20);
    border-color: rgba(220,242,255,.62);
    color: #fff;
}
.rule-credit { text-align: right; font-size: .7rem; letter-spacing: 2px; color: rgba(255,255,255,.3); }

/* Zăpada adunată (desenată din JS, urmărește forma reală a literelor / panoului) */
.rules-snow-cap, .logo-snow-cap {
    position: absolute;
    pointer-events: none;
    display: block;
}
.rules-snow-cap { z-index: 3; }
.logo-snow-cap { z-index: 2; left: 0; top: 0; }

/* ── Responsive ── */
@media (max-width: 960px) {
    .rules-panel { display: none; }
    .logo-area { left: 50%; text-align: center; transform: translate(-50%, -50%); }
}
@media (max-aspect-ratio: 3/4), (min-aspect-ratio: 10/9) and (max-aspect-ratio: 16/10) {
    .rules-panel { display: none; }
    .logo-area { left: 50%; text-align: center; transform: translate(-50%, -50%); }
}
@media (prefers-reduced-motion: reduce) {
    #snow { display: none; }
    .rules-panel { transition: none; }
}
</style>
</head>
<body>
<div id="bgPhoto"></div>
<div id="bgOverlay"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="scene">
    <div class="logo-area">
        <div class="eyebrow">International Room</div>
        <h1 class="logo-text">Sociale<canvas class="logo-snow-cap" aria-hidden="true"></canvas></h1>
        <div class="logo-sub">MySociale.Net</div>

    <aside class="rules-panel">
        <canvas class="rules-snow-cap" aria-hidden="true"></canvas>
        <div class="rules-header" id="rulesTitle">Community Rules</div>

        <div class="rule-item"><div class="rule-num">01</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">02</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">03</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">04</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">05</div><div class="rule-content"><h3></h3><p></p></div></div>

        <div class="rules-footer">
            <div class="rules-lang" role="tablist" aria-label="Rules language">
                <a class="lang-btn active" href="#" data-lang="en">EN</a>
                <a class="lang-btn" href="#" data-lang="ro">RO</a>
                <a class="lang-btn" href="#" data-lang="it">IT</a>
                <a class="lang-btn" href="#" data-lang="es">ES</a>
            </div>
            <div class="rule-credit">© SOCIALE</div>
        </div>
    </aside>
</div>

<script>
/* ── Reguli ── */
var rulesData = {
    en: { title: "Community Rules", items: [
        { h: "Freedom of Expression", p: "Feel free to chat and express yourself. All languages are allowed." },
        { h: "Mutual Respect", p: "Personal insults, excessively vulgar language, constant provocation, or harassment will not be tolerated." },
        { h: "Respect for the Staff", p: "All staff members must be treated with respect. Disrespect or undermining staff may result in a ban." },
        { h: "Transparency", p: "Bans longer than 10 hours must be accompanied by screenshot evidence. 1-hour bans are exempt." },
        { h: "Staff Impartiality", p: "Banning for personal reasons is strictly prohibited. Punishments must be fair and impartial." }
    ]},
    ro: { title: "Regulile Comunității", items: [
        { h: "Libertate de exprimare", p: "Poți discuta liber și să te exprimi. Toate limbile sunt permise." },
        { h: "Respect reciproc", p: "Insultele personale, limbajul excesiv de vulgar, provocările constante sau hărțuirea nu vor fi tolerate." },

        { h: "Transparență", p: "Banurile mai lungi de 10 ore trebuie însoțite de dovezi (screenshot). Banurile de 1 oră sunt exceptate." },
        { h: "Imparțialitatea staff-ului", p: "Banarea din motive personale este strict interzisă. Sancțiunile trebuie să fie corecte și imparțiale." }
    ]},
    it: { title: "Regole della Community", items: [
        { h: "Libertà di espressione", p: "Sentiti liberi di chattare ed esprimervi. Tutte le lingue sono consentite." },
        { h: "Rispetto reciproco", p: "Insulti personali, linguaggio eccessivamente volgare, provocazioni continue o molestie non saranno tollerati." },
        { h: "Rispetto per lo staff", p: "Tutti i membri dello staff devono essere trattati con rispetto. Mancanza di rispetto o sabotaggio può portare al ban." },
        { h: "Trasparenza", p: "I ban superiori a 10 ore devono essere accompagnati da prove (screenshot). I ban di 1 ora sono esenti." },
        { h: "Imparzialità dello staff", p: "Bannare per motivi personali è severamente vietato. Le punizioni devono essere eque e imparziali." }

    es: { title: "Reglas de la Comunidad", items: [
        { h: "Libertad de expresión", p: "Siéntete libre de chatear y expresarte. Se permiten todos los idiomas." },
        { h: "Respeto mutuo", p: "No se tolerarán insultos personales, lenguaje excesivamente vulgar, provocación constante ni acoso." },
        { h: "Respeto al staff", p: "Todo el staff debe ser tratado con respeto. La falta de respeto o el sabotaje puede resultar en ban." },
        { h: "Transparencia", p: "Los bans de más de 10 horas deben ir acompañados de pruebas (capturas). Los bans de 1 hora están exentos." },
        { h: "Imparcialidad del staff", p: "Está estrictamente prohibido banear por motivos personales. Los castigos deben ser justos e imparciales." }
    ]}
};

function applyRulesLang(lang) {
    var data = rulesData[lang] || rulesData.en;
    document.getElementById("rulesTitle").textContent = data.title;
    var items = document.querySelectorAll(".rules-panel .rule-item");
    for (var i = 0; i < items.length; i++) {
        items[i].querySelector("h3").textContent = data.items[i].h;
        items[i].querySelector("p").textContent = data.items[i].p;
    }
    var btns = document.querySelectorAll(".rules-lang .lang-btn");
    for (var j = 0; j < btns.length; j++) {
        btns[j].classList.toggle("active", btns[j].getAttribute("data-lang") === lang);
    }
}
document.querySelector(".rules-lang").addEventListener("click", function (e) {
    var b = e.target.closest(".lang-btn");
    if (!b) return;
    e.preventDefault();
    applyRulesLang(b.getAttribute("data-lang"));
});
applyRulesLang("en");

</script>

<script>
(function () {
    "use strict";
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* LITE = telefon / cadru mic: mai puțini fulgi, FPS mai mic, fără gradiente per bulgăre */
    var LITE = matchMedia("(hover: none) and (pointer: coarse)").matches || Math.min(screen.width, innerWidth) < 700;

    /* =====================================================
       1) ZĂPADA CARE CADE (un singur canvas, sprite-uri)
       ===================================================== */
    var fall = document.getElementById("snow"), fctx = fall.getContext("2d");
    var FDPR = LITE ? 0.75 : Math.min(window.devicePixelRatio || 1, 1.5);   // canvas mai mic = mult mai puțin de compus pe ecran
    var W = 0, H = 0, flakes = [], chunks = [], debris = [];
    var COUNT = LITE ? 16 : 40;
    var FPS = 30;                        // 30 = fluid; 24 = mai puțină baterie; sub 20 se vede sacadat
    var FRAME = 1000 / FPS;
    var last = 0, raf = 0, running = false, onScreen = true;

    var SIZES = LITE ? [9, 13, 18] : [8, 11, 14, 17, 20, 24];
    /* sprite-uri de fulgi desenate cu canvas (hexagonale, cu ramificații)
       – mult mai realiste decât caracterele Unicode anterioare */
    function makeSnowflakeSprite(size, kind) {
        var dim = Math.ceil(size + 20);
        var c = document.createElement("canvas");
        c.width = c.height = dim * FDPR;
        var g = c.getContext("2d");
        g.scale(FDPR, FDPR);
        g.translate(dim / 2, dim / 2);
        g.strokeStyle = "#fff";
        g.fillStyle = "#fff";
        g.lineCap = "round";
        g.shadowColor = "rgba(220,242,255,0.9)";
        g.shadowBlur = 7;
        if (kind === 0) {
            /* punct simplu pentru fulgii mici/îndepărtați */
            g.beginPath();
            g.arc(0, 0, size * 0.25, 0, 6.2832);
            g.fill();
        } else if (kind === 1) {
            /* stea simplă cu 6 brațe */
            g.lineWidth = Math.max(0.5, size * 0.07);
            for (var i = 0; i < 6; i++) {
                var ang = i * Math.PI / 3;
                g.beginPath();
                g.moveTo(0, 0);
                g.lineTo(Math.cos(ang) * size / 2, Math.sin(ang) * size / 2);
                g.stroke();
            }
            g.beginPath();
            g.arc(0, 0, size * 0.08, 0, 6.2832);
            g.fill();
        } else {
            /* fulg dendritic detaliat cu ramificații la 1/3 și 2/3 */
            g.lineWidth = Math.max(0.4, size * 0.055);
            for (var i = 0; i < 6; i++) {
                var ang = i * Math.PI / 3;
                var ex = Math.cos(ang) * size / 2, ey = Math.sin(ang) * size / 2;
                g.beginPath();
                g.moveTo(0, 0);
                g.lineTo(ex, ey);
                g.stroke();
                for (var b = 1; b <= 2; b++) {
                    var bx = ex * b / 3, by = ey * b / 3;
                    var bl = size * 0.16 * (1 - b / 4);
                    g.beginPath();
                    g.moveTo(bx, by);
                    g.lineTo(bx + Math.cos(ang + Math.PI / 3) * bl, by + Math.sin(ang + Math.PI / 3) * bl);
                    g.moveTo(bx, by);
                    g.lineTo(bx + Math.cos(ang - Math.PI / 3) * bl, by + Math.sin(ang - Math.PI / 3) * bl);
                    g.stroke();
                }
            }
            g.beginPath();
            g.arc(0, 0, size * 0.1, 0, 6.2832);
            g.fill();
        }
        return { img: c, dim: dim };
    }
    var sprites = [];
    SIZES.forEach(function (size) {
        var kind = size < 11 ? 0 : (size < 16 ? 1 : 2);
        sprites.push(makeSnowflakeSprite(size, kind));
        /* o a doua variantă pentru fulgii mai mari (varietate vizuală) */
        if (size >= 13) sprites.push(makeSnowflakeSprite(size, Math.min(2, kind + 1)));
    });

    function resizeFall() {
        W = window.innerWidth; H = window.innerHeight;
        fall.width = W * FDPR; fall.height = H * FDPR;
    }
    function make(initial) {
        return {
            x: Math.random() * W,
            y: initial ? Math.random() * H : -30,
            sp: sprites[Math.floor(Math.random() * sprites.length)],
            vy: 40 + Math.random() * 80,
            vx: -25 + Math.random() * 50,
            sway: 6 + Math.random() * 18,
            ph: Math.random() * 6.28,
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 1.6,
            a: 0.35 + Math.random() * 0.6
        };
    }
    function initFall() {
        resizeFall();
        flakes = [];
        for (var i = 0; i < COUNT; i++) flakes.push(make(true));
    }
    function spawn(x, y, r, vx, vy) {
        if (reduce || chunks.length > 60) return;
        chunks.push({ x: x, y: y, r: r, vx: vx, vy: vy, life: 1.6 });
    }
    /* debris – particule mici de zăpadă împrăștiate la ștergere */
    function spawnDebris(x, y, vx, vy) {
        if (reduce || debris.length > 90) return;
        debris.push({ x: x, y: y, vx: vx, vy: vy, life: 0.6 + Math.random() * 0.3, r: 0.4 + Math.random() * 0.9 });
    }
    var timerF = 0;
    function tick(t) {
        raf = requestAnimationFrame(tick);
        /* ritm stabil: pe ecran de 60 Hz desenăm exact la fiecare al doilea cadru (fără jitter) */
        if (t - last < FRAME - 3) return;
        var dt = Math.min((t - last) / 1000, 0.1);
        last = t;

        fctx.setTransform(1, 0, 0, 1, 0, 0);
        fctx.clearRect(0, 0, fall.width, fall.height);

        var i;
        for (i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.y += f.vy * dt;
            f.x += f.vx * dt;
            f.ph += dt * 0.8;
            f.rot += f.vr * dt;
            var px = f.x + Math.sin(f.ph) * f.sway;
            if (f.y > H + 30 || px < -40 || px > W + 40) { flakes[i] = make(false); continue; }
            var d = f.sp.dim;
            var cos = Math.cos(f.rot) * FDPR, sin = Math.sin(f.rot) * FDPR;
            fctx.setTransform(cos, sin, -sin, cos, px * FDPR, f.y * FDPR);
            fctx.globalAlpha = f.a;
            fctx.drawImage(f.sp.img, -d / 2, -d / 2, d, d);
        }

        /* bulgări de zăpadă care cad de pe text (cu gradient radial pentru volum) */
        if (chunks.length) {
            fctx.setTransform(FDPR, 0, 0, FDPR, 0, 0);
            for (i = chunks.length - 1; i >= 0; i--) {
                var c = chunks[i];
                c.vy += 520 * dt;
                c.x += c.vx * dt;
                c.y += c.vy * dt;
                c.life -= dt;
                if (c.life <= 0 || c.y > H + 20) { chunks.splice(i, 1); continue; }
                fctx.globalAlpha = Math.min(1, c.life * 2.5) * 0.95;
                /* bulgăr cu gradient radial pentru aspect de zăpadă (alb sus, gri-albastru jos) */
                if (!LITE && c.r > 2) {
                    var cg = fctx.createRadialGradient(c.x - c.r * 0.3, c.y - c.r * 0.3, 0, c.x, c.y, c.r * 1.3);
                    cg.addColorStop(0, "#ffffff");
                    cg.addColorStop(0.5, "#f4f8fc");
                    cg.addColorStop(1, "#bccde0");
                    fctx.fillStyle = cg;
                } else {
                    fctx.fillStyle = "#fff";
                }
                fctx.beginPath();
                fctx.arc(c.x, c.y, c.r, 0, 6.2832);
                fctx.fill();
            }
        }
        /* debris – particule mici de zăpadă împrăștiate la ștergere */
        if (debris.length) {
            fctx.setTransform(FDPR, 0, 0, FDPR, 0, 0);
            fctx.fillStyle = "#fff";
            for (i = debris.length - 1; i >= 0; i--) {
                var db = debris[i];
                db.vy += 350 * dt;
                db.x += db.vx * dt;
                db.y += db.vy * dt;
                db.life -= dt;
                if (db.life <= 0 || db.y > H + 10) { debris.splice(i, 1); continue; }
                fctx.globalAlpha = Math.min(1, db.life * 3) * 0.7;
                fctx.beginPath();
                fctx.arc(db.x, db.y, db.r, 0, 6.2832);
                fctx.fill();
            }
        }
        fctx.setTransform(1, 0, 0, 1, 0, 0);
        fctx.globalAlpha = 1;
    }
    function start() { if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(tick); } }
    function stop() { running = false; cancelAnimationFrame(raf); clearTimeout(timerF); }
    function sync() { (onScreen && !document.hidden) ? start() : stop(); }

    if (!reduce) {
        initFall();
        sync();
        document.addEventListener("visibilitychange", sync);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (e) { onScreen = e[0].isIntersecting; sync(); })
                .observe(document.querySelector(".scene"));
        }
        var frt;
        window.addEventListener("resize", function () { clearTimeout(frt); frt = setTimeout(initFall, 200); });
    }

    /* =====================================================
       2) ZĂPADA ADUNATĂ pe "Sociale" și pe panoul Rules
       ===================================================== */
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var SNOW_DURATION = 50000;       // cât durează până se adună toată zăpada
    var STEP = LITE ? 1200 : 600;    // redesenăm doar din când în când, nu la fiecare cadru
    var REGROW = 1 / 40;             // cât de repede se reface zăpada ștearsă (1/secunde)
    var currentG = 0.08;

    function rng(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function h01(n) { var x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
    function noise1(seed) {
        var r = rng(seed), n = 128, a = [];
        for (var i = 0; i < n; i++) a.push(r());
        return function (x) {
            var i = Math.floor(x), f = x - i;
            f = f * f * (3 - 2 * f);
            var i0 = ((i % n) + n) % n, i1 = (i0 + 1) % n;
            return a[i0] * (1 - f) + a[i1] * f;
        };
    }
    function smooth(a, b, x) {
        var t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
    }
    function snowGradient(ctx, y0, y1) {
        /* gradient de gheață cu reflexie fizică: alb pur → alb rece → albastru-deschis → albastru mediu */
        var g = ctx.createLinearGradient(0, y0, 0, Math.max(y1, y0 + 1));
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.35, "#fbfdff");
        g.addColorStop(0.7, "#e3edf6");
        g.addColorStop(1, "#a8c2d8");
        return g;
    }
    /* stea cristalină cu 6 brațe + halo + punct central – sclipire de fulg real */
    function drawSparkle(ctx, x, y, r, alpha) {
        if (r < 0.6) return;
        ctx.save();
        ctx.translate(x, y);
        /* halo moale în jurul sclipirii (doar pentru sclipiri mai mari) */
        if (!LITE && r > 1.4) {
            var halo = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.8);
            halo.addColorStop(0, "rgba(255,255,255," + (alpha * 0.35) + ")");
            halo.addColorStop(0.5, "rgba(220,240,255," + (alpha * 0.12) + ")");

    /* ---------- titlul "Sociale" ---------- */
    var logo = null, E = 4;

    function buildLogo() {
        var h1 = document.querySelector(".logo-text");

        var cs = getComputedStyle(h1);
        var fs = parseFloat(cs.fontSize) || 64;
        var Wd = Math.ceil(h1.offsetWidth), Hd = Math.round(h1.offsetHeight);

        o.textBaseline = "alphabetic";
        o.fillStyle = "#000";
        var m = o.measureText("Sociale");
        var A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
        if (!(A > 0)) { A = fs * 1.082; D = fs * 0.251; }
        var base = (L - (A + D)) / 2 + A;
        var offX = 0;
        try {
            var rg = document.createRange();
            rg.selectNodeContents(h1.firstChild);
            offX = rg.getBoundingClientRect().left - h1.getBoundingClientRect().left;
        } catch (e) { offX = 0; }

        var data = o.getImageData(0, 0, Wd, hh).data;

        var tops = new Array(Wd), x, y;
        for (x = 0; x < Wd; x++) {
            tops[x] = -1;
            for (y = 0; y < hh; y++) {
                if (data[(y * Wd + x) * 4 + 3] > 100) { tops[x] = y; break; }
            }
        }

        for (x = 0; x < Wd; x++) if (tops[x] >= 0 && tops[x] < globalTop) globalTop = tops[x];

            while (x < Wd && tops[x] >= 0 && (x === xs || Math.abs(tops[x] - tops[x - 1]) <= jump)) x++;

    function logoThick(s, i, k, grow) {

            var t = logoThick(s, i, k, grow) * wv;
            var y0 = s.ys[i], px = s.x0 + k + logo.EXT;
            var ty = y0 - t, by = y0 + 1.8 * Math.min(1, wv * 3) + t * 0.4;
            top.push([px, ty]); bot.push([px, by]);
            if (ty < minY) minY = ty;
            if (by > maxY) maxY = by;
        }
        if (top.length < 3) return;
        fillSnow(ctx, top, bot, minY, maxY);
    }

    function drawLogo(grow) {
        if (!logo) return;
        var ctx = logo.ctx;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, logo.cw, logo.ch);
        logo.segs.forEach(function (s) {
            var n = s.ys.length, a = -1, i;
            for (i = 0; i <= n; i++) {
                var on = i < n && s.w[i] > 0.05;
                if (on && a < 0) a = i;
                if (!on && a >= 0) { drawRun(ctx, s, a, i - 1, grow); a = -1; }
            }
            for (var c = 0; c < s.clumps.length; c++) {
                var cl = s.clumps[c], wv = s.w[cl.k];
                if (wv < 0.3) continue;
                var tt = logoThick(s, cl.k, cl.k, grow) * wv;
                if (tt < 1.4) continue;
                clump(ctx, s.x0 + cl.k + logo.EXT, s.ys[cl.k] - tt + cl.r * (0.2 + 0.4 * cl.dy), cl.r * (0.45 + 0.55 * grow));
            }
            if (grow > 0.4) {
                var gi = Math.pow((grow - 0.4) / 0.6, 1.4);
                for (var q = 0; q < s.ici.length; q++) {
                    var ic = s.ici[q], ki = Math.max(0, Math.min(n - 1, ic.k));
                    if (s.w[ki] < 0.6) continue;
                    var ti = logoThick(s, ki, ic.k, grow) * s.w[ki];
                    icicle(ctx, s.x0 + ic.k + logo.EXT, s.ys[ki] + 1.8 + ti * 0.4 - 1, ic.len * gi, ic.w);
                }
            }
        });
    }

    /* ---------- ștergerea zăpezii cu mouse / deget ---------- */
    var queue = [], lastP = null, raf2 = 0, timer2 = 0, lastT = 0, lastWipe = 0, dirty = false;

    function wipePoint(px, py, R, vx, vpX, vpY) {
        var any = false, EXT = logo.EXT;
        logo.segs.forEach(function (s) {
            var n = s.ys.length;
            var i0 = Math.max(0, Math.floor(px - s.x0 - EXT - R)), i1 = Math.min(n - 1, Math.ceil(px - s.x0 - EXT + R));
            for (var i = i0; i <= i1; i++) {
                var gx = s.x0 + i + EXT, t = logoThick(s, i, i, currentG);
                var sy = s.ys[i] - t * 0.5, dx = gx - px, dy = sy - py;
                var d = Math.sqrt(dx * dx + dy * dy);
                if (d >= R) continue;
                var nw = d / R; nw = nw * nw;
                if (nw < s.w[i]) {
                    var removed = s.w[i] - nw;
                    s.w[i] = nw; any = true;
                    if (removed > 0.3 && t > 1.8 && (i & 1) === 0 && Math.random() < 0.7) {
                        /* folosim coordonatele viewport reale ale pointer-ului (vpX, vpY) */
                        spawn(vpX, vpY,
                              1 + Math.random() * Math.min(3.4, t * 0.3),
                              vx * 0.2 + (Math.random() - 0.5) * 50,
                              -10 + Math.random() * 50);
                        /* debris – particule mici care se împrăștie */
                        for (var db = 0; db < 2; db++) {
                            spawnDebris(vpX, vpY,
                                vx * 0.3 + (Math.random() - 0.5) * 120,
                                -40 + Math.random() * 80);
                        }
                    }
                }
            }
        });
        if (any) lastWipe = performance.now();
        return any;
    }
    /* ștergerea zăpezii pe panoul Rules – aceeași logică ca pe titlul Sociale */
    function wipeRulesPoint(px, py, R, vx, vpX, vpY) {
        if (!rules) return false;
        var any = false, rl = rules;
        var u0 = Math.max(0, Math.floor(px - R)), u1 = Math.min(rl.cw - 1, Math.ceil(px + R));
        for (var u = u0; u <= u1; u++) {
            var t = rulesT(rl, u, currentG, 13);
            if (t < 0.35) continue;
            var X = u - rl.EXT;
            var e = edgeY(rl, X);
            var ty = e - t;
            var by = rl.byArr[u] >= 0 ? rl.byArr[u] : e + t * 0.5;
            var sy = Math.max(ty, Math.min(by, py));
            var dx = u - px, dy = sy - py;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d >= R) continue;
            var nw = d / R; nw = nw * nw;
            if (nw < rl.w[u]) {
                var removed = rl.w[u] - nw;
                rl.w[u] = nw; any = true;
                if (removed > 0.3 && t > 1.8 && (u & 1) === 0 && Math.random() < 0.7) {
                    /* FOLOSIM vpX, vpY (coordonate viewport reale ale pointer-ului)
                       în loc de rect.left + u (care e greșit din cauza transformării 3D rotateY) */
                    spawn(vpX, vpY,
                          1 + Math.random() * Math.min(3.4, t * 0.3),
                          vx * 0.2 + (Math.random() - 0.5) * 50,
                          -10 + Math.random() * 50);
                    /* debris – particule mici care se împrăștie */
                    for (var db = 0; db < 2; db++) {
                        spawnDebris(vpX, vpY,
                            vx * 0.3 + (Math.random() - 0.5) * 120,
                            -40 + Math.random() * 80);
                    }
                }
            }
        }
        if (any) lastWipe = performance.now();
        return any;
    }

    function kick() {
        if (raf2 || document.hidden) return;
        clearTimeout(timer2);
        raf2 = requestAnimationFrame(logoTick);
    }
    function logoTick(now) {
        raf2 = 0;
        if (!logo && !rules) return;
        var dt = Math.min((now - lastT) / 1000, 1); lastT = now;
        var hitL = false, hitR = false, growL = false, growR = false;
        while (queue.length) {
            var q = queue.shift();
            var isR = (q.target === "rules");
            var hit = isR ? wipeRulesPoint(q.x, q.y, q.R, q.vx, q.vpX, q.vpY)
                          : wipePoint(q.x, q.y, q.R, q.vx, q.vpX, q.vpY);
            if (hit) { if (isR) hitR = true; else hitL = true; }
        }
        var changed = hitL || hitR;
        if (changed) dirty = true;
        if (dirty && now - lastWipe > 2500) {
            var allL = true, allR = true;
            if (logo) logo.segs.forEach(function (s) {
                for (var i = 0; i < s.w.length; i++) {
                    if (s.w[i] < 1) { growL = true; s.w[i] = Math.min(1, s.w[i] + dt * REGROW); if (s.w[i] < 1) allL = false; }
                }
            });
            if (rules) {
                for (var u = 0; u < rules.w.length; u++) {
                    if (rules.w[u] < 1) { growR = true; rules.w[u] = Math.min(1, rules.w[u] + dt * REGROW); if (rules.w[u] < 1) allR = false; }
                }
            }
            if (allL && allR) dirty = false;
        }
        /* redesenăm DOAR canvasul care s-a schimbat */
        if (hitL || growL) drawLogo(currentG);
        if (hitR || growR) drawRules(currentG);
        if (changed) {
            raf2 = 1;   // blochează kick() cât așteptăm
            timer2 = setTimeout(function () { raf2 = requestAnimationFrame(logoTick); }, LITE ? 24 : 8);
        }
        else if (dirty) timer2 = setTimeout(kick, document.hidden ? 1500 : (LITE ? 800 : 400));
    }

    function onPointer(e) {
        if (reduce) return;
        var target = e.currentTarget;
        var isRules = target && target.classList && target.classList.contains("rules-panel");
        var ctxObj = isRules ? rules : logo;
        if (!ctxObj) return;
        var cv = ctxObj.cv;
        var rect = cv.getBoundingClientRect();
        ctxObj.rect = rect;
        var xCss = e.clientX - rect.left, yCss = e.clientY - rect.top;
        /* panoul Rules are rotateY(-10deg) – mapăm liniar coordonata CSS X la coordonata internă */
        var x = isRules ? (xCss / Math.max(1, rect.width)) * rules.cw : xCss;
        var y = yCss;
        /* vpX, vpY = coordonate viewport reale ale pointer-ului (pentru spawn corect al bulgărilor) */
        var vpX = e.clientX, vpY = e.clientY;
        var R = isRules ? Math.max(28, rules.cw * 0.07)
                        : (e.pointerType === "touch") ? Math.max(logo.fs * 0.6, 32) : logo.fs * 0.45;
        var tgt = isRules ? "rules" : "logo";
        if (lastP && lastP.target === tgt && e.type !== "pointerdown") {
            var dx = x - lastP.x, dy = y - lastP.y;
            var dvpX = vpX - lastP.vpX, dvpY = vpY - lastP.vpY;
            var steps = Math.min(12, Math.max(1, Math.ceil(Math.sqrt(dx * dx + dy * dy) / (R * 0.5))));
            var vx = Math.max(-200, Math.min(200, dx * 12));
            for (var s = 1; s <= steps; s++) {
                var fr = s / steps;
                queue.push({ x: lastP.x + dx * fr, y: lastP.y + dy * fr, R: R, vx: vx, target: tgt,
                             vpX: lastP.vpX + dvpX * fr, vpY: lastP.vpY + dvpY * fr });
            }
        } else {
            queue.push({ x: x, y: y, R: R, vx: 0, target: tgt, vpX: vpX, vpY: vpY });
        }
        if (queue.length > 40) queue.splice(0, queue.length - 40);
        lastP = { x: x, y: y, target: tgt, vpX: vpX, vpY: vpY };
        kick();
    }

    /* ---------- panoul Rules ---------- */
    var rules = null;

    function buildRules() {
        var p = document.querySelector(".rules-panel");
        var cv = p && p.querySelector(".rules-snow-cap");
        if (!p || !cv) { rules = null; return; }
        var Wp = p.offsetWidth;
        if (!Wp) { rules = null; return; }

        var R = 24, PAD = 34, EXT = 6, DRIP = 36;
        var cw = Wp + EXT * 2, ch = PAD + R + DRIP + 6;
        cv.style.left = (-(EXT + 1)) + "px";
        cv.style.top = (-(PAD + 1)) + "px";
        var ctx = sizeCanvas(cv, cw, ch);

        var nA = noise1(5), nB = noise1(41), nC = noise1(53), r = rng(77);
        var lump = [], lobe = [], u, X;
        for (u = 0; u < cw; u++) {
            X = u - EXT;
            /* 4 octave de noise pentru formă de acumulare mai naturală pe panou */
            var v = 0.42 * nA(X / 42) + 0.28 * nB(X / 12) + 0.15 * nB(X / 3.1 + 40) + 0.15 * nC(X / 2.2);
            lump.push(0.45 + 0.95 * v);
            lobe.push(0);
        }
        var cx = 4;
        while (cx < Wp - 4) {
            var hw = 6 + r() * 9, dep = 2.5 + r() * 6.5, c = cx + hw;
            for (u = 0; u < cw; u++) {
                X = u - EXT;
                var q = (X - c) / hw;
                if (Math.abs(q) < 1) lobe[u] = Math.max(lobe[u], dep * Math.sqrt(1 - q * q));
            }
            cx += 2 * hw + (r() * 4 - 2.5);
        }
        var clumps = [];
        for (u = 0; u < cw; u += 3) {
            if (r() < 0.6) clumps.push({ u: u, r: 1 + r() * 2.2, dy: r() });
        }
        var ici = [], ux = 12;
        while (ux < Wp - 8) {
            if (r() < 0.55) ici.push({ u: Math.round(ux + EXT), len: 6 + r() * 14, w: 3.4 + r() * 2.6 });
            ux += 14 + r() * 24;
        }
        ici.push({ u: EXT + 1, len: 10 + r() * 8, w: 3.4 }, { u: EXT + Wp - 1, len: 10 + r() * 8, w: 3.4 });
        /* weights per coloană pentru ștergerea zăpezii cu mouse/deget */
        var w = new Float32Array(cw);
        for (u = 0; u < cw; u++) w[u] = 1;
        rules = {
            ici: ici, byArr: new Array(cw),
            cv: cv, ctx: ctx, W: Wp, R: R, PAD: PAD, EXT: EXT, cw: cw, ch: ch,
            lump: lump, lobe: lobe, clumps: clumps, w: w, rect: null,
            dripL: 11 + r() * 6, dripR: 8 + r() * 6, dripL2: 5 + r() * 4, dripR2: 4 + r() * 4
        };
    }

    function edgeY(rl, X) {
        var Wp = rl.W, R = rl.R, PAD = rl.PAD;
        if (X <= 0 || X >= Wp) return PAD + R;
        if (X < R) return PAD + R - Math.sqrt(Math.max(0, R * R - (R - X) * (R - X)));
        if (X > Wp - R) { var dx = X - (Wp - R); return PAD + R - Math.sqrt(Math.max(0, R * R - dx * dx)); }
        return PAD;
    }
    function rulesCov(rl, u, grow) {
        var g = Math.max(0, (grow - 0.08) / 0.92);
        var nrm = Math.max(0, Math.min(1, (rl.lump[u] - 0.45) / 0.9));
        var c = Math.max(0, Math.min(1, (g * 1.55 - (1 - nrm)) / 0.45));
        return c * c * (3 - 2 * c);
    }
    function rulesT(rl, u, grow, maxT) {
        var X = u - rl.EXT, Wp = rl.W;
        var xc = Math.max(0, Math.min(Wp, X));
        var taper = 0.4 + 0.6 * smooth(0, 38, Math.min(xc, Wp - xc));
        var dome = 0.8 + 0.2 * Math.sin(Math.PI * xc / Wp);
        var out = X < 0 ? -X : (X > Wp ? X - Wp : 0);
        var fo = Math.max(0, 1 - out / (rl.EXT + 0.5));
        var wMul = rl.w ? rl.w[u] : 1;   /* ștergere zăpadă cu mouse */
        return maxT * rl.lump[u] * dome * taper * fo * rulesCov(rl, u, grow) * wMul;
    }
    function drip(ctx, x, y0, len, w) {
        if (len < 2.5) return;
        var y1 = y0 + len;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y0);
        ctx.lineTo(x - w / 2, y1 - w / 2);
        ctx.arc(x, y1 - w / 2, w / 2, Math.PI, 0, true);
        ctx.lineTo(x + w / 2, y0);
        ctx.closePath();
        ctx.fillStyle = snowGradient(ctx, y0, y1);
        ctx.fill();
    }
    function drawRules(grow) {
        if (!rules) return;
        var rl = rules, ctx = rl.ctx, u;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, rl.cw, rl.ch);
        var maxT = 13, g = Math.max(0, (grow - 0.08) / 0.92);
        var g15 = g * Math.sqrt(g);

        // zăpada apare în petice care cresc și se unesc
        var top = [], bot = [], minY = 1e9, maxY = -1e9;
        function flush() {
            if (top.length >= 4) fillSnow(ctx, top, bot, minY, maxY);
            top = []; bot = []; minY = 1e9; maxY = -1e9;
        }
        for (u = 0; u < rl.cw; u++) {
            var X = u - rl.EXT;
            var t = rulesT(rl, u, grow, maxT);
            if (t < 0.35) { rl.byArr[u] = -1; flush(); continue; }
            var e = edgeY(rl, X);
            var out = X < 0 ? -X : (X > rl.W ? X - rl.W : 0);
            var fo = Math.max(0, 1 - out / (rl.EXT + 0.5));
            var ty = e - t, by = e + Math.min(2.5, t * 0.5) + g15 * rl.lobe[u] * fo * rulesCov(rl, u, grow);
            rl.byArr[u] = by;
            top.push([u, ty]); bot.push([u, by]);
            if (ty < minY) minY = ty;
            if (by > maxY) maxY = by;
        }
        flush();

        // țurțuri, după ce stratul s-a format
        if (g > 0.45) {
            var gi = Math.pow((g - 0.45) / 0.55, 1.4);
            for (var q = 0; q < rl.ici.length; q++) {
                var ic = rl.ici[q], bb = rl.byArr[ic.u];
                if (bb > 0) icicle(ctx, ic.u, bb - 1, ic.len * gi, ic.w);
            }
        }

        for (var c = 0; c < rl.clumps.length; c++) {
            var cl = rl.clumps[c];
            var tt = rulesT(rl, cl.u, grow, maxT);
            if (tt < 2) continue;
            var ee = edgeY(rl, cl.u - rl.EXT);
            clump(ctx, cl.u, ee - tt + cl.r * (0.2 + 0.4 * cl.dy), cl.r * (0.45 + 0.55 * Math.min(1, tt / 5)));
        }
    }

    /* ---------- orchestrare ---------- */
    var t0 = 0, gtimer = 0, started = false;

    function renderAll(g) { currentG = g; drawLogo(g); drawRules(g); }
    function rebuild() { buildLogo(); buildRules(); renderAll(currentG); }

    function init() {
        if (started) return;
        started = true;
        buildLogo(); buildRules();
        if (reduce) {
            renderAll(1);
        } else {
            t0 = performance.now();
            renderAll(0.08);
            gtimer = setInterval(function () {
                if (document.hidden) return;
                var k = Math.min(1, (performance.now() - t0) / SNOW_DURATION);
                renderAll(0.08 + 0.92 * (1 - Math.pow(1 - k, 2)));
                if (k >= 1) clearInterval(gtimer);
            }, STEP);

            /* atașăm ascultători pointer pe ambele zone: titlul Sociale și panoul Rules */
            function attachPointer(area) {
                area.addEventListener("pointermove", onPointer);
                area.addEventListener("pointerdown", onPointer);
                area.addEventListener("pointerleave", function () { lastP = null; });
                area.addEventListener("pointerup", function () { lastP = null; });
                area.addEventListener("pointercancel", function () { lastP = null; });
            }
            var area = document.querySelector(".logo-area");
            if (area) attachPointer(area);
            var rulesPanel = document.querySelector(".rules-panel");
            if (rulesPanel) attachPointer(rulesPanel);
            document.addEventListener("visibilitychange", function () { if (!document.hidden && dirty) kick(); });
        }
        var rt, first = true;
        function sched() { clearTimeout(rt); rt = setTimeout(rebuild, 150); }
        window.addEventListener("resize", sched);
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(function () { if (first) { first = false; return; } sched(); });
            var p = document.querySelector(".rules-panel"), h = document.querySelector(".logo-text");
            if (p) ro.observe(p);
            if (h) ro.observe(h);
        }
    }

    if (document.fonts && document.fonts.load) {
        Promise.all([document.fonts.load('600 64px "Playfair Display"', "Sociale"), document.fonts.ready]).then(init, init);
        setTimeout(init, 3000);
    } else {
        window.addEventListener("load", init);
    }
})();
</script>

</body>
</html>
