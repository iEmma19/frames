<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sociale - International Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root {
    --text-primary: #ffffff;
    --text-secondary: rgba(238, 246, 255, 0.82);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Outfit', sans-serif; color: var(--text-primary);
    background: #05090f;
}

#bgPhoto {
    position: fixed; inset: 0; z-index: 0;
    background: url("https://xatimg.com/image/G2qhwG3vl95c.png") center/cover no-repeat;
}
#bgOverlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(circle at 50% 0%, rgba(12,19,37,.15), rgba(8,13,24,.78) 55%, rgba(8,13,24,.92));
}

/* Zăpadă: un singur canvas, nu zeci de elemente */
#snow {
    position: fixed; inset: 0; z-index: 12;
    width: 100%; height: 100%;
    pointer-events: none;
}

.scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; z-index: 2; }

/* ── Titlu stânga ── */
.logo-area {
    position: absolute; left: 80px; top: 50%;
    transform: translateY(calc(-50% + 63px));
    z-index: 15; text-align: left;
}
.eyebrow {
    font-size: .75rem; letter-spacing: 4px; text-transform: uppercase;
    color: #fff; font-weight: 500; margin-bottom: 10px;
}
h1.logo-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 5vw, 72px);
    font-weight: 600; line-height: .9; margin-bottom: 10px;
    background: linear-gradient(105deg, #ffffff 0%, #d9f2ff 30%, #ffffff 50%, #a9d8f2 75%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 0 24px rgba(205,238,255,.35);
}
.logo-sub { font-size: 1rem; font-weight: 300; color: #fff; margin-top: 10px; }

/* ── Panou reguli (fără backdrop-filter și fără animații) ── */
.rules-panel {
    position: absolute; top: 50%; right: 9%;
    transform: translateY(-50%) perspective(800px) rotateY(-10deg);
    transform-origin: left center;
    width: clamp(240px, 18vw, 310px);
    z-index: 15;
    display: flex; flex-direction: column;
    padding: 24px;
    background: linear-gradient(145deg, rgba(3,7,12,.97) 0%, rgba(12,22,32,.96) 55%, rgba(23,39,52,.94) 100%);
    border: 1px solid rgba(225,244,255,.30);
    border-radius: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.58), inset 0 1px 1px rgba(255,255,255,.14);
    transition: transform .3s ease;
}
.rules-panel:hover { transform: translateY(-50%) perspective(800px) rotateY(-6deg); }

.rules-header {
    font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic;
    margin-bottom: 24px;
    background: linear-gradient(90deg, #ffffff 0%, #c8eaff 50%, #a9d7f2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
}
.rule-item { display: flex; gap: 14px; margin-bottom: 20px; }
.rule-num {
    font-size: 1rem; font-weight: 800; min-width: 20px; letter-spacing: .02em;
    background: linear-gradient(90deg, #b7e4ff 0%, #ffffff 50%, #a9d7f2 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
}
.rule-content h3 { color: #fff; }
.rule-content p { font-size: .75rem; font-weight: 300; line-height: 1.5; color: var(--text-secondary); }

.rules-footer {
    margin-top: auto; padding-top: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.08);
}
.rules-lang { display: flex; gap: 6px; justify-content: center; }
.lang-btn {
    border: 1px solid rgba(220,240,255,.2);
    background: rgba(220,240,255,.08);
    color: rgba(255,255,255,.85);
    padding: 6px 10px; border-radius: 999px;
    font-family: 'Outfit', sans-serif; font-size: .7rem; font-weight: 650;
    letter-spacing: .06em; text-transform: uppercase;
    cursor: pointer; text-decoration: none; line-height: 1;
}
.lang-btn.active {
    background: rgba(190,230,255,.20);
    border-color: rgba(220,242,255,.62);
    color: #fff;
}
.rule-credit { text-align: right; font-size: .7rem; letter-spacing: 2px; color: rgba(255,255,255,.3); }

/* ── Responsive ── */
@media (max-width: 960px) {
    .rules-panel { display: none; }
    .logo-area { left: 50%; text-align: center; transform: translate(-50%, -50%); }
}
@media (max-aspect-ratio: 3/4), (min-aspect-ratio: 10/9) and (max-aspect-ratio: 16/10) {
    .rules-panel { display: none; }
    .logo-area { left: 50%; text-align: center; transform: translate(-50%, -50%); }
}
@media (prefers-reduced-motion: reduce) {
    #snow { display: none; }
    .rules-panel { transition: none; }
}
</style>
</head>
<body>
<div id="bgPhoto"></div>
<div id="bgOverlay"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="scene">
    <div class="logo-area">
        <div class="eyebrow">International Room</div>
        <h1 class="logo-text">Sociale</h1>
        <div class="logo-sub">MySociale.Net</div>
    </div>

    <aside class="rules-panel">
        <div class="rules-header" id="rulesTitle">Community Rules</div>

        <div class="rule-item"><div class="rule-num">01</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">02</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">03</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">04</div><div class="rule-content"><h3></h3><p></p></div></div>
        <div class="rule-item"><div class="rule-num">05</div><div class="rule-content"><h3></h3><p></p></div></div>

        <div class="rules-footer">
            <div class="rules-lang" role="tablist" aria-label="Rules language">
                <a class="lang-btn active" href="#" data-lang="en">EN</a>
                <a class="lang-btn" href="#" data-lang="ro">RO</a>
                <a class="lang-btn" href="#" data-lang="it">IT</a>
                <a class="lang-btn" href="#" data-lang="es">ES</a>
            </div>
            <div class="rule-credit">© SOCIALE</div>
        </div>
    </aside>
</div>

<script>
/* ── Reguli ── */
var rulesData = {
    en: { title: "Community Rules", items: [
        { h: "Freedom of Expression", p: "Feel free to chat and express yourself. All languages are allowed." },
        { h: "Mutual Respect", p: "Personal insults, excessively vulgar language, constant provocation, or harassment will not be tolerated." },
        { h: "Respect for the Staff", p: "All staff members must be treated with respect. Disrespect or undermining staff may result in a ban." },
        { h: "Transparency", p: "Bans longer than 10 hours must be accompanied by screenshot evidence. 1-hour bans are exempt." },
        { h: "Staff Impartiality", p: "Banning for personal reasons is strictly prohibited. Punishments must be fair and impartial." }
    ]},
    ro: { title: "Regulile Comunității", items: [
        { h: "Libertate de exprimare", p: "Poți discuta liber și să te exprimi. Toate limbile sunt permise." },
        { h: "Respect reciproc", p: "Insultele personale, limbajul excesiv de vulgar, provocările constante sau hărțuirea nu vor fi tolerate." },
        { h: "Respect față de staff", p: "Toți membrii staff-ului trebuie tratați cu respect. Disprețul sau subminarea staff-ului poate duce la ban." },
        { h: "Transparență", p: "Banurile mai lungi de 10 ore trebuie însoțite de dovezi (screenshot). Banurile de 1 oră sunt exceptate." },
        { h: "Imparțialitatea staff-ului", p: "Banarea din motive personale este strict interzisă. Sancțiunile trebuie să fie corecte și imparțiale." }
    ]},
    it: { title: "Regole della Community", items: [
        { h: "Libertà di espressione", p: "Sentiti liberi di chattare ed esprimervi. Tutte le lingue sono consentite." },
        { h: "Rispetto reciproco", p: "Insulti personali, linguaggio eccessivamente volgare, provocazioni continue o molestie non saranno tollerati." },
        { h: "Rispetto per lo staff", p: "Tutti i membri dello staff devono essere trattati con rispetto. Mancanza di rispetto o sabotaggio può portare al ban." },
        { h: "Trasparenza", p: "I ban superiori a 10 ore devono essere accompagnati da prove (screenshot). I ban di 1 ora sono esenti." },
        { h: "Imparzialità dello staff", p: "Bannare per motivi personali è severamente vietato. Le punizioni devono essere eque e imparziali." }
    ]},
    es: { title: "Reglas de la Comunidad", items: [
        { h: "Libertad de expresión", p: "Siéntete libre de chatear y expresarte. Se permiten todos los idiomas." },
        { h: "Respeto mutuo", p: "No se tolerarán insultos personales, lenguaje excesivamente vulgar, provocación constante ni acoso." },
        { h: "Respeto al staff", p: "Todo el staff debe ser tratado con respeto. La falta de respeto o el sabotaje puede resultar en ban." },
        { h: "Transparencia", p: "Los bans de más de 10 horas deben ir acompañados de pruebas (capturas). Los bans de 1 hora están exentos." },
        { h: "Imparcialidad del staff", p: "Está estrictamente prohibido banear por motivos personales. Los castigos deben ser justos e imparciales." }
    ]}
};

function applyRulesLang(lang) {
    var data = rulesData[lang] || rulesData.en;
    document.getElementById("rulesTitle").textContent = data.title;
    var items = document.querySelectorAll(".rules-panel .rule-item");
    for (var i = 0; i < items.length; i++) {
        items[i].querySelector("h3").textContent = data.items[i].h;
        items[i].querySelector("p").textContent = data.items[i].p;
    }
    var btns = document.querySelectorAll(".rules-lang .lang-btn");
    for (var j = 0; j < btns.length; j++) {
        btns[j].classList.toggle("active", btns[j].getAttribute("data-lang") === lang);
    }
}
document.querySelector(".rules-lang").addEventListener("click", function (e) {
    var b = e.target.closest(".lang-btn");
    if (!b) return;
    e.preventDefault();
    applyRulesLang(b.getAttribute("data-lang"));
});
applyRulesLang("en");

/* ── Zăpadă: sprite-uri pre-randate (❄ ❅ ❆ ·), 1 canvas, ~30 FPS ── */
(function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;

    var canvas = document.getElementById("snow");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, flakes = [];
    var isMobile = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var COUNT = isMobile ? 28 : 50;
    var FRAME = 1000 / 30;
    var last = 0, raf = 0, running = false;

    /* 4 forme x 6 mărimi, desenate o singură dată */
    var SYMBOLS = ["❄︎", "❅︎", "❆︎", "·"];
    var SIZES = [8, 11, 14, 17, 20, 24];
    var sprites = SYMBOLS.map(function (sym, si) {
        return SIZES.map(function (size) {
            var s = (si === 3 ? size * 1.6 : size);
            var dim = Math.ceil(s + 20);
            var c = document.createElement("canvas");
            c.width = c.height = dim * dpr;
            var g = c.getContext("2d");
            g.scale(dpr, dpr);
            g.font = s + "px 'Segoe UI Symbol','Arial Unicode MS','DejaVu Sans',sans-serif";
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillStyle = "#fff";
            g.shadowColor = "rgba(220,242,255,0.9)";
            g.shadowBlur = 7;
            g.fillText(sym, dim / 2, dim / 2);
            return { img: c, dim: dim };
        });
    });

    function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
    }

    function make(initial) {
        return {
            x: Math.random() * W,
            y: initial ? Math.random() * H : -30,
            sp: sprites[Math.floor(Math.random() * SYMBOLS.length)][Math.floor(Math.random() * SIZES.length)],
            vy: 40 + Math.random() * 80,
            vx: -25 + Math.random() * 50,
            sway: 6 + Math.random() * 18,
            ph: Math.random() * 6.28,
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 1.6,
            a: 0.35 + Math.random() * 0.6
        };
    }

    function init() {
        resize();
        flakes = [];
        for (var i = 0; i < COUNT; i++) flakes.push(make(true));
    }

    function tick(t) {
        raf = requestAnimationFrame(tick);
        if (t - last < FRAME) return;
        var dt = Math.min((t - last) / 1000, 0.1);
        last = t;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            f.y += f.vy * dt;
            f.x += f.vx * dt;
            f.ph += dt * 0.8;
            f.rot += f.vr * dt;
            var px = f.x + Math.sin(f.ph) * f.sway;
            if (f.y > H + 30 || px < -40 || px > W + 40) { flakes[i] = make(false); continue; }

            var d = f.sp.dim;
            var cos = Math.cos(f.rot) * dpr, sin = Math.sin(f.rot) * dpr;
            ctx.setTransform(cos, sin, -sin, cos, px * dpr, f.y * dpr);
            ctx.globalAlpha = f.a;
            ctx.drawImage(f.sp.img, -d / 2, -d / 2, d, d);
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
    }

    function start() { if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(tick); } }
    function stop()  { running = false; cancelAnimationFrame(raf); }

    document.addEventListener("visibilitychange", function () { document.hidden ? stop() : start(); });
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(init, 200); });

    init();
    start();
})();
</script>
</body>
</html>
