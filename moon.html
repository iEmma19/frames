<html lang="ro"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sociale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600&amp;family=Poppins:wght@300;400;500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

@property --a1{
    syntax:'<angle>';
    initial-value:0deg;
    inherits:false;
}

@property --a2{
    syntax:'<angle>';
    initial-value:60deg;
    inherits:false;
}

@property --a3{
    syntax:'<angle>';
    initial-value:120deg;
    inherits:false;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:linear-gradient(
        180deg,
        #020810 0%,
        #06101f 30%,
        #0a1628 60%,
        #0d1a30 100%
    );

    font-family:'Poppins',sans-serif;
}

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.star{
    position:absolute;
    border-radius:50%;
    background:#fff;
}

.star.twinkle-slow{
    animation:twinkle 4s ease-in-out infinite;
}

.star.twinkle-med{
    animation:twinkle 2.5s ease-in-out infinite;
}

.star.twinkle-fast{
    animation:twinkle 1.8s ease-in-out infinite;
}

@keyframes twinkle{

    0%,100%{
        opacity:var(--base-opacity,.3);
    }

    50%{
        opacity:var(--peak-opacity,1);
    }

}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star{
    position:absolute;

    width:80px;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8)
    );

    border-radius:1px;

    opacity:0;

    z-index:4;

    transform:rotate(35deg);

    animation:shoot 1.2s ease-out forwards;
}

.shooting-star::before{

    content:"";

    position:absolute;

    right:0;
    top:-1px;

    width:4px;
    height:3px;

    border-radius:50%;

    background:#fff;

    box-shadow:
    0 0 6px 2px rgba(200,210,255,.6);
}

@keyframes shoot{

    0%{
        transform:
        rotate(var(--angle,35deg))
        translateX(0);

        opacity:0;
    }

    5%{
        opacity:1;
    }

    70%{
        opacity:.6;
    }

    100%{
        transform:
        rotate(var(--angle,35deg))
        translateX(350px);

        opacity:0;
    }

}

/* =========================
   MOON
========================= */

.
element.style {
}
.moon {
    position: absolute;
    top: 5%;
    left: 20%;
    width: 221px;
    height: 216px;
    background-color: #FFF1F9;
    border-radius: 100%;
    box-shadow: inset #FFF1F9 -4px 4px 12px 4px, inset rgba(0, 0, 0, 0.2) -12px 12px 60px 4px, #1B3040 0 0 24px 1px, #FFF1F9 0 0 80px 4px;
    z-index: 5;
    pointer-events: none;
}

.moon:before,
.moon:after{

    content:"";

    opacity:.6;

    position:absolute;

    background-color:#FFF1F9;

    border-radius:100%;

    box-shadow:
    inset rgba(0,0,0,0.06)
    2px 4px 4px 2px;
}

.moon:before{

    top:14%;
    right:26%;

    width:5%;
    height:10%;

    transform:rotate(-45deg);
}

.moon:after{

    top:20%;
    right:30%;

    width:15%;
    height:20%;

    transform:rotate(-35deg);
}

/* =========================
   AURORA
========================= */

.aurora{
    position:absolute;
    inset:0;

    overflow:hidden;

    filter:blur(35px);

    opacity:.75;

    animation:
    auroraPulse 12s ease-in-out infinite alternate;

    z-index:2;

    pointer-events:none;
}

@keyframes auroraPulse{

    0%{
        opacity:.6;
        filter:blur(60px)
    }

    50%{
        opacity:.75;
        filter:blur(40px)
    }

    100%{
        opacity:.6;
        filter:blur(45px)
    }

}

.band{
    position:absolute;

    width:200%;
    left:-50%;

    border-radius:50%;

    transform-origin:center center;
}

.band-1{

    height:55vh;
    top:-10vh;

    background:
    conic-gradient(
        from var(--a1) at 40% 60%,
        transparent 0%,
        rgba(0,255,200,.5) 15%,
        rgba(0,170,255,.4) 30%,
        transparent 45%,
        rgba(170,68,255,.3) 60%,
        transparent 75%
    );

    animation:band1 40s linear infinite;
}

@keyframes band1{
    to{
        --a1:360deg
    }
}

.band-2{

    height:60vh;
    top:5vh;

    background:
    conic-gradient(
        from var(--a2) at 60% 40%,
        transparent 0%,
        rgba(255,102,170,.4) 10%,
        rgba(0,255,200,.3) 25%,
        transparent 40%,
        rgba(0,170,255,.5) 55%,
        transparent 70%
    );

    animation:band2 55s linear infinite reverse;
}

@keyframes band2{
    to{
        --a2:420deg
    }
}

.band-3{

    height:50vh;
    top:-5vh;

    background:
    conic-gradient(
        from var(--a3) at 30% 70%,
        transparent 0%,
        rgba(68,255,170,.4) 20%,
        transparent 35%,
        rgba(255,102,170,.3) 50%,
        rgba(170,68,255,.4) 65%,
        transparent 80%
    );

    animation:band3 48s linear infinite;
}

@keyframes band3{
    to{
        --a3:480deg
    }
}

/* =========================
   FOG
========================= */

.fog{
    position:absolute;
    pointer-events:none;
    filter:blur(30px);
}

.fog-1{

    top:2%;
    left:-5%;

    width:60%;
    height:150px;

    background:
    radial-gradient(
        ellipse at 50% 50%,
        rgba(140,150,180,.2) 0%,
        rgba(120,130,165,.08) 45%,
        transparent 70%
    );

    z-index:3;

    animation:fogFloat1 25s ease-in-out infinite;
}

.fog-2{

    top:10%;
    left:30%;

    width:55%;
    height:120px;

    background:
    radial-gradient(
        ellipse at 50% 50%,
        rgba(160,165,195,.22) 0%,
        rgba(130,140,175,.09) 40%,
        transparent 65%
    );

    z-index:3;

    animation:fogFloat2 30s ease-in-out infinite;
}

.fog-3{

    top:6%;
    left:10%;

    width:50%;
    height:180px;

    background:
    radial-gradient(
        ellipse at 50% 50%,
        rgba(120,130,165,.17) 0%,
        rgba(100,110,150,.07) 45%,
        transparent 65%
    );

    z-index:3;

    animation:fogFloat3 20s ease-in-out infinite;
}

@keyframes fogFloat1{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(200px);
    }

}

@keyframes fogFloat2{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-250px);
    }

}

@keyframes fogFloat3{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(180px);
    }

}

/* =========================
   TEXT
========================= */

.logo-area{

    position:absolute;

    left:80px;
    top:50%;

    transform:translateY(-50%);

    z-index:10;

    text-align:left;

    color:#fff;
}

.eyebrow{

    font-size:11px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:rgba(0,255,200,.7);

    margin-bottom:20px;

    font-weight:300;

    font-family:'Raleway',sans-serif;
}

.logo-text{

    font-family:'Raleway',sans-serif;

    font-size:clamp(32px,6vw,80px);

    font-weight:200;

    letter-spacing:8px;

    text-transform:uppercase;

    line-height:1;

    margin-bottom:20px;

    color:#fff;

    text-shadow:
        0 0 40px rgba(0,255,200,.3),
        0 0 80px rgba(0,170,255,.2);
}

.logo-sub{

    font-size:15px;

    font-weight:300;

    letter-spacing:2px;

    color:rgba(255,255,255,.45);
}

/* =========================
   CHAT BACKDROP
========================= */

.chat-backdrop{

    position:absolute;

    top:93px;
    left:50.25%;

    transform:translateX(-50%);

    width:728px;
    height:486px;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    border-radius:16px;

    border:1px solid #000;

    z-index:20;

    pointer-events:none;
}

/* =========================
   RULES PANEL
========================= */

.rules-panel{
    position:absolute;

    top:336px;
    right:5%;

    transform:
    translateY(-50%)
    perspective(800px)
    rotateY(-10deg);

    transform-origin:left center;

    width:clamp(220px,17vw,290px);

    z-index:15;
}

.rules-card{

    background:rgba(8,12,25,.85);

    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);

    border:1px solid rgba(80,100,130,.25);

    border-radius:0;

    padding:0 0 8px;

    box-shadow:
        0 24px 64px rgba(0,0,0,.4),
        0 4px 12px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(80,100,130,.1);

    overflow:hidden;
}

.rules-card::before{

    content:"⸸";

    display:block;

    text-align:center;

    font-size:.7rem;

    color:rgba(120,140,165,.3);

    padding-top:2px;

    letter-spacing:12px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(70,95,125,.15),
        transparent
    );

    height:14px;

    line-height:14px;
}

.rules-header{

    font-family:'Poppins',sans-serif;

    font-size:.8rem;

    font-weight:700;

    color:rgba(180,195,215,.9);

    letter-spacing:4px;

    text-transform:uppercase;

    text-align:center;

    padding:12px 26px;

    background:
    linear-gradient(
        135deg,
        rgba(12,20,35,.9),
        rgba(6,12,22,.95)
    );

    border-top:1px solid rgba(70,95,125,.15);

    border-bottom:1px solid rgba(70,95,125,.12);
}

.rules-list{

    padding:16px 18px 10px;

    display:flex;
    flex-direction:column;

    gap:14px;
}

.rule-item{

    display:flex;

    gap:10px;

    align-items:flex-start;
}

.rule-num{

    font-family:'Lilita One',cursive;

    font-size:1.1rem;

    font-weight:700;

    color:rgba(90,115,145,.35);

    line-height:1.3;

    flex-shrink:0;
}

.rule-txt{

    font-family:'Poppins',sans-serif;

    font-size:.7rem;

    font-weight:500;

    color:rgba(160,175,195,.8);

    text-align:left;

    line-height:1.4;
}

.rules-card::after{

    content:"";

    display:block;

    height:1px;

    margin:10px 20px 0;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(70,95,125,.2),
        transparent
    );
}

.rule-credit{

    font-size:.8rem;

    color:rgba(90,115,145,.25);

    text-align:right;

    margin-top:6px;

    padding-right:6px;

    letter-spacing:.5px;
}

/* =========================
   MOUNTAINS
========================= */

.mountains{

    position:absolute;

    bottom:0;
    left:0;
    right:0;

    height:22vh;

    z-index:6;

    pointer-events:none;
}

.mountains svg{
    width:100%;
    height:100%;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .rules-panel{
        display:none;
    }

}

@media(max-width:768px){

    .logo-area{
        left:30px;
        right:30px;
    }

    .moon{
        width:120px;
        height:120px;
    }

}

</style>
</head>

<script>

/* =========================
   STARS
========================= */

var starsEl = document.getElementById("stars");

var twinkleClasses = [
    "twinkle-slow",
    "twinkle-med",
    "twinkle-fast"
];

for(var i=0;i<300;i++){

    var s = document.createElement("div");

    s.className = "star";

    var size =
    Math.random() < 0.6
    ? 1
    : (Math.random() < 0.75 ? 1.5 : 2.5);

    s.style.width = size + "px";
    s.style.height = size + "px";

    s.style.top = (Math.random() * 80) + "%";
    s.style.left = (Math.random() * 100) + "%";

    var baseOp = 0.15 + Math.random() * 0.3;

    s.style.setProperty("--base-opacity", baseOp);

    s.style.setProperty(
        "--peak-opacity",
        Math.min(baseOp + 0.5 + Math.random() * 0.3,1)
    );

    if(Math.random() < 0.6){

        s.classList.add(
            twinkleClasses[
                Math.floor(Math.random() * 3)
            ]
        );

        s.style.animationDelay =
        (Math.random() * 6) + "s";

    }else{

        s.style.opacity = baseOp;

    }

    if(size >= 2){

        s.style.boxShadow =
        "0 0 " +
        (2 + Math.random() * 3) +
        "px rgba(180,190,255,.4)";
    }

    starsEl.appendChild(s);
}

/* =========================
   SHOOTING STARS
========================= */

var shootEl =
document.getElementById("shootingStars");

function spawnShootingStar(){

    var el =
    document.createElement("div");

    el.className = "shooting-star";

    el.style.top =
    (3 + Math.random() * 55) + "%";

    el.style.left =
    (5 + Math.random() * 85) + "%";

    var angle =
    25 + Math.random() * 30;

    el.style.setProperty(
        "--angle",
        angle + "deg"
    );

    el.style.transform =
    "rotate(" + angle + "deg)";

    el.style.width =
    (60 + Math.random() * 60) + "px";

    shootEl.appendChild(el);

    setTimeout(function(){

        el.remove();

    },1500);

}

function scheduleShoot(){

    var delay =
    3000 + Math.random() * 5000;

    setTimeout(function(){

        spawnShootingStar();
        scheduleShoot();

    },delay);

}

setTimeout(function(){

    spawnShootingStar();
    scheduleShoot();

},1500 + Math.random() * 1500);

</script>
