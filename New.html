<script>
(function(){
    function rand(min, max) { return Math.random() * (max - min) + min; }

    function createStars() {
        var starsEl = document.getElementById("stars");
        if (!starsEl) return;
        starsEl.innerHTML = "";

        var w = window.innerWidth || 1280;
        var h = window.innerHeight || 720;
        var count = Math.max(60, Math.min(160, Math.floor((w * h) / 14000)));

        for (var i = 0; i < count; i++) {
            var s = document.createElement("div");
            s.className = "star";
            var size = rand(1, 2.2);
            s.style.width = size + "px";
            s.style.height = size + "px";
            s.style.left = rand(0, 100) + "%";
            s.style.top = rand(0, 100) + "%";
            s.style.setProperty("--base-opacity", String(rand(0.15, 0.5)));
            s.style.setProperty("--peak-opacity", String(rand(0.55, 1)));
            var t = Math.random();
            s.classList.add(t < 0.33 ? "twinkle-slow" : t < 0.66 ? "twinkle-med" : "twinkle-fast");
            starsEl.appendChild(s);
        }
    }

    function spawnShootingStar() {
        var layer = document.getElementById("shootingStars");
        if (!layer) return;
        var s = document.createElement("div");
        s.className = "shooting-star";
        var startX = rand(-20, window.innerWidth * 0.85);
        var startY = rand(0, window.innerHeight * 0.6);
        s.style.left = startX + "px";
        s.style.top = startY + "px";
        s.style.setProperty("--angle", (rand(20, 55)).toFixed(2) + "deg");
        layer.appendChild(s);
        setTimeout(function () { s.remove(); }, 1600);
    }

    function scheduleShootingStars() {
        var delay = 1800 + Math.random() * 5200;
        setTimeout(function () {
            spawnShootingStar();
            scheduleShootingStars();
        }, delay);
    }

    createStars();
    scheduleShootingStars();
    window.addEventListener("resize", function () { createStars(); });
})();
</script>
